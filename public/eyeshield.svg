<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="shieldGradient" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF512F" />
      <stop offset="1" stop-color="#DD2476" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Shield Background -->
  <path d="M256 32L55 105C55 105 35 300 256 480C477 300 457 105 457 105L256 32Z" fill="url(#shieldGradient)" stroke="none"/>
  
  <!-- Eye/Iris Outer -->
  <circle cx="256" cy="220" r="85" fill="#111111" />
  
  <!-- Eye/Iris Inner Ring -->
  <circle cx="256" cy="220" r="60" stroke="url(#shieldGradient)" stroke-width="12" fill="none" />
  
  <!-- Pupil -->
  <circle cx="256" cy="220" r="25" fill="#FFFFFF" />
  
  <!-- Sound Wave / Tech Lines -->
  <path d="M256 350L256 410" stroke="#111111" stroke-width="20" stroke-linecap="round" />
  <path d="M200 365L200 395" stroke="#111111" stroke-width="20" stroke-linecap="round" />
  <path d="M312 365L312 395" stroke="#111111" stroke-width="20" stroke-linecap="round" />

</svg>
